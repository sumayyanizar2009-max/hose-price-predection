<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | HousePredict</title>


<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #eef2ff, #f5f3ff, #ede9fe);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 25px 15px;
    }

    .container {
        width: 100%;
        max-width: 430px;
        background: white;
        padding: 35px 32px;
        border-radius: 22px;
        box-shadow: 0 15px 45px rgba(81, 69, 229, 0.12);
        border: 1px solid #ede9fe;
    }

    .logo {
        width: 70px;
        height: 70px;
        margin: 0 auto 18px;
        border-radius: 21px;
        background: linear-gradient(135deg, #5145e5, #8b5cf6);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 35px;
        box-shadow: 0 8px 20px rgba(81, 69, 229, 0.2);
    }

    h1 {
        text-align: center;
        color: #1e293b;
        font-size: 27px;
        margin-bottom: 10px;
    }

    .subtitle {
        text-align: center;
        color: #64748b;
        font-size: 14px;
        line-height: 1.6;
        margin-bottom: 25px;
    }

    .messages {
        margin-bottom: 18px;
    }

    .message {
        background: #fff1f2;
        color: #be123c;
        padding: 12px;
        border-radius: 9px;
        font-size: 14px;
        margin-bottom: 8px;
        line-height: 1.5;
    }

    .form-group {
        margin-bottom: 17px;
    }

    label {
        display: block;
        margin-bottom: 8px;
        color: #334155;
        font-weight: bold;
        font-size: 14px;
    }

    .input-wrap {
        position: relative;
    }

    input {
        width: 100%;
        padding: 13px;
        border: 1px solid #cbd5e1;
        border-radius: 10px;
        font-size: 14px;
        outline: none;
        transition: 0.2s;
    }

    input:focus {
        border-color: #5145e5;
        box-shadow: 0 0 0 3px rgba(81, 69, 229, 0.12);
    }

    input::placeholder {
        color: #94a3b8;
    }

    .password-input {
        padding-right: 72px;
    }

    .toggle-password {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        border: none;
        background: transparent;
        color: #5145e5;
        font-size: 12px;
        font-weight: bold;
        cursor: pointer;
        padding: 8px 0 8px 8px;
    }

    .register-btn {
        width: 100%;
        padding: 15px;
        margin-top: 8px;
        background: linear-gradient(135deg, #5145e5, #7c3aed);
        color: white;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
    }

    .register-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 18px rgba(81, 69, 229, 0.25);
    }

    .login-text {
        text-align: center;
        margin-top: 23px;
        font-size: 14px;
        color: #64748b;
        line-height: 1.8;
    }

    a {
        color: #5145e5;
        text-decoration: none;
        font-weight: bold;
    }

    a:hover {
        text-decoration: underline;
    }

    .footer {
        text-align: center;
        margin-top: 22px;
        color: #94a3b8;
        font-size: 12px;
    }

    @media (max-width: 400px) {
        .container {
            padding: 28px 20px;
        }

        h1 {
            font-size: 24px;
        }
    }
</style>


</head>

<body>


<main class="container">

    <div class="logo">🏠</div>

    <h1>Create Account</h1>
    <p class="subtitle">
        Join HousePredict today!<br>
        Start predicting house prices.
    </p>

    {% if messages %}
        <div class="messages">
            {% for message in messages %}
                <p class="message">{{ message }}</p>
            {% endfor %}
        </div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <div class="form-group">
            <label for="username">👤 Username</label>
            <input
                type="text"
                id="username"
                name="username"
                placeholder="Choose a username"
                autocomplete="username"
                required
            >
        </div>

        <div class="form-group">
            <label for="email">📧 Email Address</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                autocomplete="email"
                required
            >
        </div>

        <div class="form-group">
            <label for="password">🔒 Password</label>

            <div class="input-wrap">
                <input
                    type="password"
                    id="password"
                    name="password"
                    class="password-input"
                    placeholder="Create a password"
                    autocomplete="new-password"
                    required
                >

                <button
                    type="button"
                    class="toggle-password"
                    data-target="password"
                >Show</button>
            </div>
        </div>

        <div class="form-group">
            <label for="confirm_password">🔐 Confirm Password</label>

            <div class="input-wrap">
                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    class="password-input"
                    placeholder="Re-enter your password"
                    autocomplete="new-password"
                    required
                >

                <button
                    type="button"
                    class="toggle-password"
                    data-target="confirm_password"
                >Show</button>
            </div>
        </div>

        <button type="submit" class="register-btn">
            Create My Account →
        </button>
    </form>

    <p class="login-text">
        Already have an account?<br>
        <a href="{% url 'login' %}">Login here</a>
    </p>

    <div class="footer">
        HousePredict · House Price Prediction System
    </div>

</main>

<script>
    document.querySelectorAll(".toggle-password").forEach(function(button) {
        button.addEventListener("click", function() {
            const input = document.getElementById(this.dataset.target);
            const isHidden = input.type === "password";

            input.type = isHidden ? "text" : "password";
            this.textContent = isHidden ? "Hide" : "Show";
            this.setAttribute("aria-pressed", String(isHidden));
        });
    });
</script>


</body>
</html>
