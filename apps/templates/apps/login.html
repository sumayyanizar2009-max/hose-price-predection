<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | HousePredict</title>


<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #eef2ff, #f5f3ff, #ede9fe);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 25px 15px;
    }

    .container {
        width: 100%;
        max-width: 430px;
        background: white;
        padding: 38px 32px;
        border-radius: 22px;
        box-shadow: 0 15px 45px rgba(81, 69, 229, 0.12);
        border: 1px solid #ede9fe;
    }

    .logo {
        width: 75px;
        height: 75px;
        margin: 0 auto 20px;
        border-radius: 22px;
        background: linear-gradient(135deg, #5145e5, #8b5cf6);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 38px;
        box-shadow: 0 8px 20px rgba(81, 69, 229, 0.2);
    }

    h1 {
        text-align: center;
        color: #1e293b;
        font-size: 27px;
        margin-bottom: 10px;
    }

    .subtitle {
        text-align: center;
        color: #64748b;
        font-size: 14px;
        line-height: 1.6;
        margin-bottom: 28px;
    }

    .messages {
        margin-bottom: 18px;
    }

    .message {
        background: #fff1f2;
        color: #be123c;
        padding: 12px;
        border-radius: 9px;
        font-size: 14px;
        margin-bottom: 8px;
        line-height: 1.5;
    }

    .form-group {
        margin-bottom: 20px;
    }

    label {
        display: block;
        margin-bottom: 9px;
        color: #334155;
        font-weight: bold;
        font-size: 14px;
    }

    .input-wrap {
        position: relative;
    }

    input {
        width: 100%;
        padding: 14px;
        border: 1px solid #cbd5e1;
        border-radius: 10px;
        font-size: 15px;
        outline: none;
        transition: 0.2s;
    }

    input:focus {
        border-color: #5145e5;
        box-shadow: 0 0 0 3px rgba(81, 69, 229, 0.12);
    }

    .password-input {
        padding-right: 75px;
    }

    .toggle-password {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        border: none;
        background: transparent;
        color: #5145e5;
        font-size: 12px;
        font-weight: bold;
        cursor: pointer;
        padding: 8px 0 8px 8px;
    }

    .login-btn {
        width: 100%;
        padding: 15px;
        margin-top: 8px;
        background: linear-gradient(135deg, #5145e5, #7c3aed);
        color: white;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
    }

    .login-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 18px rgba(81, 69, 229, 0.25);
    }

    .register-text {
        text-align: center;
        margin-top: 25px;
        font-size: 14px;
        color: #64748b;
        line-height: 1.8;
    }

    a {
        color: #5145e5;
        text-decoration: none;
        font-weight: bold;
    }

    a:hover {
        text-decoration: underline;
    }

    .footer {
        text-align: center;
        margin-top: 25px;
        color: #94a3b8;
        font-size: 12px;
    }

    @media (max-width: 400px) {
        .container {
            padding: 30px 22px;
        }

        h1 {
            font-size: 24px;
        }
    }
</style>


</head>

<body>


<main class="container">

    <div class="logo">🏠</div>

    <h1>Welcome Back!</h1>
    <p class="subtitle">
        Login to your HousePredict account<br>
        and continue predicting house prices.
    </p>

    {% if messages %}
        <div class="messages">
            {% for message in messages %}
                <p class="message">{{ message }}</p>
            {% endfor %}
        </div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <div class="form-group">
            <label for="username">👤 Username</label>
            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter your username"
                autocomplete="username"
                required
            >
        </div>

        <div class="form-group">
            <label for="password">🔒 Password</label>

            <div class="input-wrap">
                <input
                    type="password"
                    id="password"
                    name="password"
                    class="password-input"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

                <button
                    type="button"
                    class="toggle-password"
                    id="togglePassword"
                    aria-label="Show password"
                    aria-pressed="false"
                >
                    Show
                </button>
            </div>
        </div>

        <button type="submit" class="login-btn">
            Login to Account →
        </button>
    </form>

    <p class="register-text">
        Don't have an account?<br>
        <a href="{% url 'register' %}">Create a new account</a>
    </p>

    <div class="footer">
        HousePredict · House Price Prediction System
    </div>

</main>

<script>
    const passwordInput = document.getElementById("password");
    const toggleButton = document.getElementById("togglePassword");

    toggleButton.addEventListener("click", function () {
        const isHidden = passwordInput.type === "password";

        passwordInput.type = isHidden ? "text" : "password";
        toggleButton.textContent = isHidden ? "Hide" : "Show";
        toggleButton.setAttribute("aria-pressed", String(isHidden));
        toggleButton.setAttribute(
            "aria-label",
            isHidden ? "Hide password" : "Show password"
        );
    });
</script>


</body>
</html>
